[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ukb-look"
version = "2026.9.9"
description = "Reproducible single- or multi-GPU bilateral CFP-OCT glaucoma LOOK study"
requires-python = ">=3.10,<3.14"

[tool.setuptools]
packages = ["look_core", "V4"]
package-dir = {"look_core" = "tool/look_core", "V4" = "third_party/MHD_Project/V4"}

[tool.pytest.ini_options]
testpaths = ["tool/tests"]
addopts = "-ra -p no:cacheprovider"
