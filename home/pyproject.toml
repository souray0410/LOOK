[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ukb-look"
version = "2026.9.3"
description = "Reproducible single- or multi-GPU bilateral CFP-OCT glaucoma LOOK study"
requires-python = ">=3.10,<3.14"

[tool.setuptools]
package-dir = {"" = "tool"}

[tool.setuptools.packages.find]
where = ["tool"]
include = ["look_core*", "MHD_Project*"]

[tool.pytest.ini_options]
testpaths = ["tool/tests"]
addopts = "-ra -p no:cacheprovider"
